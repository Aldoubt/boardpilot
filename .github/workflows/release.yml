name: Desktop packages
on:
  push:
    branches: [main]
    paths: ['VERSION', 'packaging/**', 'requirements-build.txt', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libfuse2 desktop-file-utils
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -v
      - run: python packaging/build.py
      - name: Windows packaged GUI check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/BoardPilot.exe -ArgumentList '--smoke-test','--smoke-tab','2' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged GUI failed: $($p.ExitCode)" }
      - name: Linux packaged GUI and desktop install check
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./dist/BoardPilot --smoke-test --smoke-tab 2
          cd dist/BoardPilot-*-linux-*/
          desktop-file-validate boardpilot.desktop
          bash install.sh
          desktop-file-validate "$HOME/.local/share/applications/boardpilot.desktop"
          xvfb-run -a "$HOME/.local/share/boardpilot/BoardPilot" --smoke-test --smoke-tab 2
          bash uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/BoardPilot-*.exe
            dist/BoardPilot-*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "BoardPilot $tag preview" --prerelease --notes "Windows x64: download and open the EXE. Ubuntu 22.04/24.04 x86_64: extract the tar.gz, run bash install.sh, then open BoardPilot from the applications menu. Git is required for source packaging. SHA256 files are included."
          gh release upload "$tag" release-assets/* --clobber
