name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - name: Check Python 3.8 syntax
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),feature_version=(3,8)) for p in pathlib.Path('.').glob('*.py')]"
      - name: GUI smoke test on Windows
        if: runner.os == 'Windows'
        run: python deployer_gui.py --smoke-test --smoke-tab 2
      - name: GUI smoke test on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          xvfb-run -a python deployer_gui.py --smoke-test --smoke-tab 2
